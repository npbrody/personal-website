<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Communication Anxiety Assessment</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
</head>
<body>
<div id="prca-quiz-root"></div>

<script type="text/babel">
const { useState } = React;

const AlertCircle = ({ className }) => (
  <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="12" cy="12" r="10"></circle>
    <line x1="12" y1="8" x2="12" y2="12"></line>
    <line x1="12" y1="16" x2="12.01" y2="16"></line>
  </svg>
);

const Users = ({ className }) => (
  <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
    <circle cx="9" cy="7" r="4"></circle>
    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
  </svg>
);

const TrendingUp = ({ className }) => (
  <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
    <polyline points="17 6 23 6 23 12"></polyline>
  </svg>
);

const TrendingDown = ({ className }) => (
  <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <polyline points="23 18 13.5 8.5 8.5 13.5 1 6"></polyline>
    <polyline points="17 18 23 18 23 12"></polyline>
  </svg>
);

const Minus = ({ className }) => (
  <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <line x1="5" y1="12" x2="19" y2="12"></line>
  </svg>
);

// Personal Report of Communication Apprehension (PRCA-24), McCroskey (1982).
// 24 items, 1 (strongly disagree) to 5 (strongly agree). "calm" items are
// reverse-scored (6 - raw) before summing, matching the published scoring
// key: subscale = 18 - (sum of calm items) + (sum of apprehension items).
const questions = [
  { id: 1, subscale: 'groupDiscussion', direction: 'apprehension', text: "I dislike participating in group discussions." },
  { id: 2, subscale: 'groupDiscussion', direction: 'calm', text: "Generally, I am comfortable while participating in group discussions." },
  { id: 3, subscale: 'groupDiscussion', direction: 'apprehension', text: "I am tense and nervous while participating in group discussions." },
  { id: 4, subscale: 'groupDiscussion', direction: 'calm', text: "I like to get involved in group discussions." },
  { id: 5, subscale: 'groupDiscussion', direction: 'apprehension', text: "Engaging in a group discussion with new people makes me tense and nervous." },
  { id: 6, subscale: 'groupDiscussion', direction: 'calm', text: "I am calm and relaxed while participating in group discussions." },

  { id: 7, subscale: 'meetings', direction: 'apprehension', text: "Generally, I am nervous when I have to participate in a meeting." },
  { id: 8, subscale: 'meetings', direction: 'calm', text: "Usually, I am comfortable when I have to participate in a meeting." },
  { id: 9, subscale: 'meetings', direction: 'calm', text: "I am very calm and relaxed when I am called upon to express an opinion at a meeting." },
  { id: 10, subscale: 'meetings', direction: 'apprehension', text: "I am afraid to express myself at meetings." },
  { id: 11, subscale: 'meetings', direction: 'apprehension', text: "Communicating at meetings usually makes me uncomfortable." },
  { id: 12, subscale: 'meetings', direction: 'calm', text: "I am very relaxed when answering questions at a meeting." },

  { id: 13, subscale: 'interpersonal', direction: 'apprehension', text: "While participating in a conversation with a new acquaintance, I feel very nervous." },
  { id: 14, subscale: 'interpersonal', direction: 'calm', text: "I have no fear of speaking up in conversations." },
  { id: 15, subscale: 'interpersonal', direction: 'apprehension', text: "Ordinarily I am very tense and nervous in conversations." },
  { id: 16, subscale: 'interpersonal', direction: 'calm', text: "Ordinarily I am very calm and relaxed in conversations." },
  { id: 17, subscale: 'interpersonal', direction: 'calm', text: "While conversing with a new acquaintance, I feel very relaxed." },
  { id: 18, subscale: 'interpersonal', direction: 'apprehension', text: "I'm afraid to speak up in conversations." },

  { id: 19, subscale: 'publicSpeaking', direction: 'calm', text: "I have no fear of giving a speech." },
  { id: 20, subscale: 'publicSpeaking', direction: 'apprehension', text: "Certain parts of my body feel very tense and rigid while giving a speech." },
  { id: 21, subscale: 'publicSpeaking', direction: 'calm', text: "I feel relaxed while giving a speech." },
  { id: 22, subscale: 'publicSpeaking', direction: 'apprehension', text: "My thoughts become confused and jumbled when I am giving a speech." },
  { id: 23, subscale: 'publicSpeaking', direction: 'calm', text: "I face the prospect of giving a speech with confidence." },
  { id: 24, subscale: 'publicSpeaking', direction: 'apprehension', text: "While giving a speech, I get so nervous I forget facts I really know." }
];

// Published norms, McCroskey (1982), based on over 40,000 college students.
const norms = {
  total: { mean: 65.6, sd: 15.3, high: 80, low: 51 },
  groupDiscussion: { mean: 15.4, sd: 4.8, high: 20, low: 11 },
  meetings: { mean: 16.4, sd: 4.2, high: 20, low: 13 },
  interpersonal: { mean: 14.2, sd: 3.9, high: 18, low: 11 },
  publicSpeaking: { mean: 19.3, sd: 5.1, high: 24, low: 14 }
};

const subscaleInfo = {
  groupDiscussion: { name: "Group Discussion", description: "Communicating as part of a small group or discussion." },
  meetings: { name: "Meetings", description: "Speaking up and participating in meetings." },
  interpersonal: { name: "Interpersonal (Dyad)", description: "One-on-one conversations, especially with people you don't know well." },
  publicSpeaking: { name: "Public Speaking", description: "Giving speeches or presentations in front of an audience." }
};

const subscaleOrder = ['groupDiscussion', 'meetings', 'interpersonal', 'publicSpeaking'];

const shuffle = (arr) => {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
};

const levelFor = (score, bounds) => {
  if (score > bounds.high) return { label: "High", color: "text-orange-700" };
  if (score < bounds.low) return { label: "Low", color: "text-blue-700" };
  return { label: "Average", color: "text-gray-700" };
};

const PRCAQuiz = () => {
  const [quizQuestions, setQuizQuestions] = useState(() => shuffle(questions));
  const [currentQuestion, setCurrentQuestion] = useState(0);
  const [answers, setAnswers] = useState({});
  const [showResults, setShowResults] = useState(false);

  const handleAnswer = (value) => {
    const q = quizQuestions[currentQuestion];
    setAnswers({ ...answers, [q.id]: value });

    if (currentQuestion < quizQuestions.length - 1) {
      setCurrentQuestion(currentQuestion + 1);
    } else {
      setShowResults(true);
    }
  };

  const calculateScores = () => {
    const totals = { groupDiscussion: 0, meetings: 0, interpersonal: 0, publicSpeaking: 0 };
    questions.forEach((q) => {
      if (answers[q.id] !== undefined) {
        const scored = q.direction === 'calm' ? (6 - answers[q.id]) : answers[q.id];
        totals[q.subscale] += scored;
      }
    });
    const total = subscaleOrder.reduce((sum, s) => sum + totals[s], 0);
    return { ...totals, total };
  };

  const restart = () => {
    setQuizQuestions(shuffle(questions));
    setCurrentQuestion(0);
    setAnswers({});
    setShowResults(false);
  };

  if (showResults) {
    const scores = calculateScores();
    const totalLevel = levelFor(scores.total, norms.total);

    return (
      <div className="max-w-3xl mx-auto p-6 bg-white rounded-lg shadow-lg my-8">
        <h2 className="text-2xl font-bold mb-2 text-gray-800">Your Results</h2>
        <p className="text-gray-600 mb-6">This measures communication apprehension, a general tendency toward fear or anxiety about communicating with others, not a diagnosis of any kind.</p>

        <div className="p-5 mb-6 bg-gray-50 rounded-lg border-2 border-gray-200">
          <div className="flex items-baseline justify-between mb-1">
            <span className="font-semibold text-gray-800">Total Score</span>
            <span className="text-2xl font-bold text-gray-800">{scores.total} / 120</span>
          </div>
          <p className={`text-sm font-medium mb-2 ${totalLevel.color}`}>{totalLevel.label} communication apprehension</p>
          <p className="text-sm text-gray-600">
            Below 51 is considered very low communication apprehension, 51 to 80 is average, and above 80 reflects a high level of trait communication apprehension. The published average among college students is {norms.total.mean} (SD {norms.total.sd}).
          </p>
        </div>

        <h3 className="text-lg font-semibold mb-4 text-gray-800">By Context</h3>
        <div className="space-y-4 mb-6">
          {subscaleOrder.map((s) => {
            const score = scores[s];
            const bounds = norms[s];
            const level = levelFor(score, bounds);
            const diff = score - bounds.mean;
            return (
              <div key={s} className="p-4 bg-gray-50 rounded-lg border-2 border-gray-200">
                <div className="flex items-baseline justify-between mb-1">
                  <span className="font-semibold text-gray-800">{subscaleInfo[s].name}</span>
                  <span className="text-xl font-bold text-gray-800">{score} / 30</span>
                </div>
                <div className="w-full bg-gray-200 rounded-full h-2 mb-2">
                  <div className="bg-orange-400 h-2 rounded-full transition-all duration-300" style={{ width: `${((score - 6) / 24) * 100}%` }}></div>
                </div>
                <p className="text-sm text-gray-600 mb-1">{subscaleInfo[s].description}</p>
                <div className="flex items-center gap-1 text-sm">
                  {diff > 0.5 ? <TrendingUp className="w-4 h-4 text-orange-600" /> : diff < -0.5 ? <TrendingDown className="w-4 h-4 text-blue-600" /> : <Minus className="w-4 h-4 text-gray-400" />}
                  <span className={`font-medium ${level.color}`}>{level.label}</span>
                  <span className="text-gray-500">&middot; published average is {bounds.mean}</span>
                </div>
              </div>
            );
          })}
        </div>

        <div className="p-4 bg-blue-50 rounded-lg border border-blue-200 mb-6">
          <div className="flex items-start gap-2">
            <AlertCircle className="w-5 h-5 text-blue-600 mt-1 flex-shrink-0" />
            <div className="text-sm text-gray-700">
              <p>Norms are from McCroskey (1982), based on over 40,000 college students; a national sample of over 3,000 non-student adults produced nearly identical results. This is a self-report measure of general tendencies, not a clinical assessment, and many factors beyond these scores shape how anxious communicating actually feels in a given moment.</p>
            </div>
          </div>
        </div>

        <button onClick={restart} className="w-full bg-orange-500 text-white py-3 rounded-lg hover:bg-orange-600 transition-colors font-medium">
          Take Quiz Again
        </button>

        <p className="text-xs text-gray-400 mt-6 text-center">
          Personal Report of Communication Apprehension (PRCA-24). Source: McCroskey, J. C. (1982). <em>An introduction to rhetorical communication</em> (4th ed.). Englewood Cliffs, NJ: Prentice-Hall.
        </p>
      </div>
    );
  }

  return (
    <div className="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow-lg my-8">
      <div className="mb-6">
        <h2 className="text-2xl font-bold mb-2 text-gray-800">Communication Anxiety Assessment</h2>
        <p className="text-gray-600 mb-4">This instrument asks about feelings when communicating with others. Answer honestly rather than as you think you should feel.</p>
        <div className="flex justify-between items-center text-sm text-gray-500">
          <span>Question {currentQuestion + 1} of {quizQuestions.length}</span>
          <span>{Math.round((currentQuestion / quizQuestions.length) * 100)}% complete</span>
        </div>
        <div className="w-full bg-gray-200 rounded-full h-2 mt-2">
          <div className="bg-orange-500 h-2 rounded-full transition-all duration-300" style={{ width: `${(currentQuestion / quizQuestions.length) * 100}%` }}></div>
        </div>
      </div>

      <div className="mb-8">
        <p className="text-lg font-medium text-gray-800 mb-6">{quizQuestions[currentQuestion].text}</p>

        <div className="space-y-3">
          {['Strongly Disagree', 'Disagree', 'Neutral', 'Agree', 'Strongly Agree'].map((label, index) => (
            <button
              key={index}
              onClick={() => handleAnswer(index + 1)}
              className="w-full p-4 text-left border-2 border-gray-200 rounded-lg hover:border-orange-400 hover:bg-orange-50 transition-all"
            >
              <span className="font-medium">{label}</span>
            </button>
          ))}
        </div>
      </div>

      {currentQuestion > 0 && (
        <button onClick={() => setCurrentQuestion(currentQuestion - 1)} className="text-orange-700 hover:text-orange-900 font-medium">
          ← Previous Question
        </button>
      )}

      <p className="text-xs text-gray-400 mt-6">Personal Report of Communication Apprehension (PRCA-24), McCroskey (1982).</p>
    </div>
  );
};

ReactDOM.render(<PRCAQuiz />, document.getElementById('prca-quiz-root'));
</script>
</body>
</html>
