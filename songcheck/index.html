<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song Checker · Texas Chainsaw Composers</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #FBF7EF;
    --card: #FFFFFF;
    --ink: #17141C;
    --purple: #7C1FD6;
    --purple-soft: #F6EEFC;
    --yellow: #F2C744;
    --muted: #6B6577;
    --line: #E7E2ED;
    --danger: #D5453C;
    --s1: #7C1FD6;
    --s1-bg: #F6EEFC;
    --s2: #2563EB;
    --s2-bg: #EAF2FF;
    --s3: #E8574A;
    --s3-bg: #FDECEA;
  }

  html { height: 100%; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 80px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .logo-badge {
    width: 160px;
    height: auto;
    border: 3px solid var(--ink);
    border-radius: 6px;
    transform: rotate(-3deg);
    background: #fff;
    padding: 5px;
    box-shadow: 4px 4px 0 var(--ink);
  }

  .eyebrow {
    font-family: 'Kalam', cursive;
    font-size: 20px;
    color: var(--purple);
    transform: rotate(-1deg);
  }

  h1 {
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(30px, 6vw, 44px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.05;
    color: var(--ink);
    position: relative;
    display: inline-block;
  }

  h1 span {
    color: var(--purple);
  }

  .title-squiggle {
    position: absolute;
    left: 2px;
    bottom: -12px;
    width: 70%;
    height: 14px;
  }

  .stat-strip {
    display: flex;
    gap: 10px;
    margin-top: 6px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .stat-chip {
    padding: 7px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    transform: rotate(-1deg);
  }

  .stat-chip.chip-dark {
    background: var(--ink);
    color: #fff;
  }

  .stat-chip.chip-yellow {
    background: var(--yellow);
    color: var(--ink);
    transform: rotate(1deg);
  }

  /* Search box */
  .search-wrap {
    width: 100%;
    max-width: 580px;
    margin-bottom: 32px;
  }

  .search-box {
    display: flex;
    align-items: center;
    background: var(--card);
    border: 2.5px solid var(--ink);
    border-radius: 14px;
    padding: 4px 4px 4px 20px;
    gap: 12px;
    box-shadow: 5px 5px 0 var(--ink);
    transition: transform 0.1s, box-shadow 0.1s;
  }

  .search-box:focus-within {
    transform: translate(2px, 2px);
    box-shadow: 3px 3px 0 var(--ink);
  }

  .search-icon {
    color: var(--purple);
    flex-shrink: 0;
    font-size: 18px;
  }

  #searchInput {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    color: var(--ink);
    padding: 14px 0;
    min-width: 0;
  }

  #searchInput::placeholder { color: #A7A0B3; }

  .clear-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 10px;
    border-radius: 8px;
    display: none;
    font-size: 18px;
    transition: color 0.15s;
  }

  .clear-btn:hover { color: var(--ink); }
  .clear-btn.visible { display: flex; }

  .search-options {
    margin-top: 12px;
    display: flex;
    align-items: center;
    padding-left: 4px;
  }

  .exact-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }

  .exact-toggle input[type="checkbox"] { display: none; }

  .toggle-track {
    width: 36px;
    height: 20px;
    background: var(--line);
    border-radius: 10px;
    position: relative;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .exact-toggle input:checked + .toggle-track {
    background: var(--purple);
  }

  .toggle-thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 14px;
    height: 14px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.2s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }

  .exact-toggle input:checked + .toggle-track .toggle-thumb {
    transform: translateX(16px);
  }

  .toggle-label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
  }

  .exact-toggle:hover .toggle-label { color: var(--ink); }

  /* Results */
  .results-area {
    width: 100%;
    max-width: 580px;
  }

  .results-header {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
    padding: 0 4px;
  }

  .no-results {
    text-align: center;
    padding: 40px 24px;
  }

  .safe-message {
    background: var(--purple-soft);
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 28px;
    text-align: center;
    box-shadow: 5px 5px 0 var(--ink);
  }

  .safe-message .safe-icon { font-size: 36px; margin-bottom: 10px; }

  .safe-message h3 {
    font-family: 'DM Sans', sans-serif;
    font-weight: 800;
    font-size: 16px;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .safe-message p { font-size: 14px; color: var(--muted); }

  .result-card {
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 16px 20px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.1s, box-shadow 0.1s;
  }

  .result-card:hover {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 var(--ink);
  }

  .result-thumb {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    background: var(--yellow);
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  .result-thumb img { width: 100%; height: 100%; object-fit: cover; }

  .result-info { flex: 1; min-width: 0; }

  .result-title {
    font-weight: 700;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 3px;
  }

  .result-artist {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .season-badge {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.04em;
    padding: 5px 11px;
    border-radius: 20px;
    flex-shrink: 0;
  }

  .badge-S1 { background: var(--s1-bg); color: var(--s1); }
  .badge-S2 { background: var(--s2-bg); color: var(--s2); }
  .badge-S3 { background: var(--s3-bg); color: var(--s3); }

  .duplicate-warning {
    background: #FDECEA;
    border: 2px solid var(--ink);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--danger);
  }

  .empty-state {
    text-align: center;
    padding: 56px 24px;
    color: var(--muted);
  }

  .empty-state .big-icon {
    font-size: 48px;
    margin-bottom: 16px;
    display: block;
  }

  .empty-state h3 {
    font-family: 'DM Sans', sans-serif;
    font-weight: 800;
    font-size: 16px;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .empty-state p {
    font-size: 14px;
    line-height: 1.7;
    max-width: 340px;
    margin: 0 auto;
  }

  .match-highlight {
    background: var(--yellow);
    color: var(--ink);
    font-weight: 700;
    border-radius: 3px;
    padding: 0 2px;
  }

  /* Scrollable list when browsing all */
  .all-songs-wrap {
    width: 100%;
    max-width: 580px;
    margin-top: 40px;
  }

  .all-songs-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .all-songs-header h2 {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .filter-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filter-tab {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 13px;
    border-radius: 20px;
    cursor: pointer;
    border: 1.5px solid var(--line);
    background: none;
    color: var(--muted);
    transition: all 0.15s;
  }

  .filter-tab.active-all { background: var(--ink); color: #fff; border-color: var(--ink); }
  .filter-tab.active-s1 { background: var(--s1-bg); color: var(--s1); border-color: var(--s1); }
  .filter-tab.active-s2 { background: var(--s2-bg); color: var(--s2); border-color: var(--s2); }
  .filter-tab.active-s3 { background: var(--s3-bg); color: var(--s3); border-color: var(--s3); }
  .filter-tab.active-artists { background: var(--yellow); color: var(--ink); border-color: var(--ink); }

  .song-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 520px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .song-list::-webkit-scrollbar { width: 4px; }
  .song-list::-webkit-scrollbar-track { background: transparent; }
  .song-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .song-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 16px;
    border-radius: 10px;
    background: var(--card);
    font-size: 14px;
    border: 1.5px solid var(--line);
    cursor: pointer;
    transition: border-color 0.15s, transform 0.1s;
  }

  .song-row:hover { border-color: var(--ink); transform: translateX(2px); }

  .song-row-title {
    flex: 1;
    font-weight: 600;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .song-row-artist {
    font-size: 12px;
    color: var(--muted);
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 180px;
  }

  footer {
    margin-top: 56px;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-align: center;
  }

  /* Artist leaderboard panel */
  .artist-panel {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .freq-legend {
    display: flex;
    gap: 16px;
  }

  .freq-leg-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
  }

  .freq-leg-swatch {
    width: 12px;
    height: 12px;
    border-radius: 3px;
  }

  .freq-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 520px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .freq-list::-webkit-scrollbar { width: 4px; }
  .freq-list::-webkit-scrollbar-track { background: transparent; }
  .freq-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .freq-row {
    display: grid;
    grid-template-columns: 22px 1fr auto;
    align-items: center;
    gap: 10px;
    font-size: 12px;
  }

  .freq-rank {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: #B4ADC2;
    text-align: right;
  }

  .freq-bar-wrap {
    position: relative;
    height: 30px;
    background: var(--card);
    border-radius: 8px;
    overflow: hidden;
    border: 1.5px solid var(--line);
  }

  .freq-segs {
    display: flex;
    height: 100%;
    width: 100%;
  }

  .freq-seg {
    height: 100%;
    opacity: 0.55;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }

  .freq-bar-wrap:hover .freq-seg {
    opacity: 0.8;
  }

  .freq-name {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: calc(100% - 40px);
  }

  .freq-count {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    color: var(--purple);
    font-weight: 800;
    white-space: nowrap;
  }

</style>
</head>

// Search
const input = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const resultsArea = document.getElementById('resultsArea');

function normalize(str) {
  if (!str) return '';
  return str
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function highlight(text, query) {
  if (!query || !text) return text || '';
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${escaped})`, 'gi'), '<span class="match-highlight">$1</span>');
}

function search(query) {
  const q = normalize(query);
  if (!q) return null;

  const exactOnly = document.getElementById('exactMatch').checked;
  const words = q.split(' ').filter(Boolean);
  const scored = [];

  for (const song of UNIQUE_SONGS) {
    const titleN = normalize(song.t);
    const artistN = normalize(song.a);
    const combined = titleN + ' ' + artistN;

    let score = 0;

    if (exactOnly) {
      // Match if title exactly equals query, or if query exactly matches any individual artist
      if (titleN === q) score += 100;
      const artistList = song.a.split(',').map(a => normalize(a.trim()));
      if (artistList.some(a => a === q)) score += 50;
    } else {
      // Exact title match
      if (titleN === q) score += 100;
      // Title starts with query
      else if (titleN.startsWith(q)) score += 80;
      // Title contains full query
      else if (titleN.includes(q)) score += 60;

      // Artist exact
      if (artistN === q) score += 50;
      else if (artistN.includes(q)) score += 30;

      // Word matches
      let wordMatchCount = 0;
      for (const w of words) {
        if (combined.includes(w)) wordMatchCount++;
      }
      score += (wordMatchCount / words.length) * 40;
    }

    if (score > 5) scored.push({ song, score });
  }

  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, 20).map(x => x.song);
}

function renderResults(query) {
  const results = search(query);

  if (!results) {
    resultsArea.innerHTML = `
      <div class="empty-state">
        <span class="big-icon">🎵</span>
        <h3>Start typing to search</h3>
        <p>We'll check Seasons 1, 2, and 3 (so far) instantly.</p>
      </div>`;
    return;
  }

  if (results.length === 0) {
    resultsArea.innerHTML = `
      <div class="no-results">
        <div class="safe-message">
          <div class="safe-icon">✅</div>
          <h3>Not found in the archive</h3>
          <p>No submission matches "${query}" across S1, S2, or S3. Looks like it's fair game.</p>
        </div>
      </div>`;
    return;
  }

  // Check for likely dupes (same spotify ID or very close title/artist)
  const topResult = results[0];
  const isDuplicate = normalize(topResult.t).includes(normalize(query)) || normalize(topResult.a).includes(normalize(query));

  let html = `<div class="results-header">${results.length} result${results.length !== 1 ? 's' : ''} found</div>`;

  if (results.length > 0) {
    html += `<div class="duplicate-warning">⚠️ This song or artist has been submitted before — check below before you pick it.</div>`;
  }

  for (const song of results) {
    const spotifyUrl = `https://open.spotify.com/track/${song.id}`;
    const highlightedTitle = highlight(song.t, query);
    const highlightedArtist = highlight(song.a, query);
    html += `
      <div class="result-card" onclick="window.open('${spotifyUrl}', '_blank')">
        <div class="result-thumb">🎵</div>
        <div class="result-info">
          <div class="result-title">${highlightedTitle}</div>
          <div class="result-artist">${highlightedArtist}</div>
        </div>
        <span class="season-badge badge-${song.s}">${song.s}</span>
      </div>`;
  }

  resultsArea.innerHTML = html;
}

input.addEventListener('input', () => {
  const q = input.value.trim();
  clearBtn.classList.toggle('visible', q.length > 0);
  renderResults(q || null);
});

document.getElementById('exactMatch').addEventListener('change', () => {
  const q = input.value.trim();
  if (q) renderResults(q);
});

clearBtn.addEventListener('click', () => {
  input.value = '';
  clearBtn.classList.remove('visible');
  renderResults(null);
  input.focus();
});

// Browse all
let currentFilter = 'all';

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-tab').forEach(b => {
    b.className = 'filter-tab';
  });
  if (filter === 'all') btn.classList.add('active-all');
  else if (filter === 'S1') btn.classList.add('active-s1');
  else if (filter === 'S2') btn.classList.add('active-s2');
  else if (filter === 'S3') btn.classList.add('active-s3');
  else btn.classList.add('active-artists');

  const songListEl = document.getElementById('songList');
  const artistPanel = document.getElementById('artistPanel');
  const archiveTitle = document.getElementById('archiveTitle');

  if (filter === 'artists') {
    songListEl.style.display = 'none';
    artistPanel.style.display = '';
    archiveTitle.textContent = 'Most submitted artists';
  } else {
    artistPanel.style.display = 'none';
    songListEl.style.display = '';
    archiveTitle.textContent = 'Full archive';
    renderBrowse();
  }
}

function renderBrowse() {
  const filtered = currentFilter === 'all'
    ? [...UNIQUE_SONGS]
    : UNIQUE_SONGS.filter(s => s.s === currentFilter);

  filtered.sort((a, b) => a.t.localeCompare(b.t));

  const list = document.getElementById('songList');
  list.innerHTML = filtered.map(song => `
    <div class="song-row" onclick="window.open('https://open.spotify.com/track/${song.id}', '_blank')" style="cursor:pointer">
      <span class="season-badge badge-${song.s}">${song.s}</span>
      <span class="song-row-title">${song.t}</span>
      <span class="song-row-artist">${song.a}</span>
    </div>
  `).join('');
}
